<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9c99f">
  <title>З днем народження</title>
  <meta name="description" content="Вітальна листівка з днем народження">
  <meta property="og:title" content="З днем народження">
  <meta property="og:description" content="Вітальна листівка з днем народження">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%23e0704a'/%3E%3Ccircle cx='32' cy='32' r='17' fill='%23f3a259'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%23f7d47e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/book.css">
  <link rel="stylesheet" href="css/page.css">
  <link rel="stylesheet" href="css/flower.css">
</head>
<body>
  <main class="viewport" id="viewport">
    <div class="camera" id="camera">
      <div class="shadow" id="shadow"></div>
      <div class="tilt" id="tilt">
        <div class="book" id="book">

          <!-- Обложка: первый «лист» книги. Спереди — рисунок, сзади — внутренняя левая сторона -->
          <div class="leaf" id="cover" role="button" tabindex="0" aria-label="Відкрити листівку">
            <div class="face front paper cover-front">
              <h1 class="c-head"><span>З днем</span><span>народження</span></h1>
              <svg class="emblem" viewBox="0 0 200 300" aria-hidden="true">
                <defs>
                  <linearGradient id="cv-petal-a" x1="0" y1="1" x2="0" y2="0">
                    <stop offset="0" stop-color="#cf5a3b"/><stop offset="1" stop-color="#ee9366"/>
                  </linearGradient>
                  <linearGradient id="cv-petal-b" x1="0" y1="1" x2="0" y2="0">
                    <stop offset="0" stop-color="#e2704a"/><stop offset="1" stop-color="#f6b078"/>
                  </linearGradient>
                  <linearGradient id="cv-leaf" x1="0" y1="1" x2="1" y2="0">
                    <stop offset="0" stop-color="#6d7c3d"/><stop offset="1" stop-color="#a1ad62"/>
                  </linearGradient>
                </defs>
                <path class="e-stem" d="M100 146 C103 190 95 238 100 292" fill="none" stroke="#6d7c3d" stroke-width="4" stroke-linecap="round"/>
                <path d="M100 262 C68 258 44 228 38 192 C68 200 92 226 100 262 Z" fill="url(#cv-leaf)" stroke="#55622c" stroke-width="1.3" stroke-linejoin="round"/>
                <path d="M100 232 C132 230 154 206 160 172 C132 180 108 202 100 232 Z" fill="url(#cv-leaf)" stroke="#55622c" stroke-width="1.3" stroke-linejoin="round"/>
                <path d="M100 150 C58 146 44 96 54 50 C84 62 106 104 100 150 Z" fill="url(#cv-petal-a)" stroke="#a8432b" stroke-width="1.4" stroke-linejoin="round"/>
                <path d="M100 150 C142 146 156 96 146 50 C116 62 94 104 100 150 Z" fill="url(#cv-petal-a)" stroke="#a8432b" stroke-width="1.4" stroke-linejoin="round"/>
                <path d="M100 152 C74 132 68 84 100 34 C132 84 126 132 100 152 Z" fill="url(#cv-petal-b)" stroke="#a8432b" stroke-width="1.4" stroke-linejoin="round"/>
                <path d="M100 140 C90 112 92 82 100 56" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
              <div class="c-foot">
                <svg class="c-orn" viewBox="0 0 120 12" aria-hidden="true"><path d="M2 6H50M70 6H118" stroke="#b98a3f" stroke-width="1.2" stroke-linecap="round" fill="none"/><path d="M60 1.5 65 6 60 10.5 55 6Z" fill="#b98a3f"/></svg>
                <p class="c-name">Оксана Анатоліївна</p>
              </div>
              <div class="shade"></div>
            </div>
            <div class="face back paper cover-back"><div class="shade"></div></div>
          </div>

        </div>
      </div>
    </div>
    <p class="hint" id="hint">натисніть щоб відкрити</p>
  </main>

  <script src="js/poem.js"></script>
  <script src="js/util.js"></script>
  <script src="js/flower.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/writer.js"></script>
  <script src="js/book-core.js"></script>
  <script src="js/book-pages.js"></script>
  <script src="js/book-open.js"></script>
  <script src="js/book-bend.js"></script>
  <script src="js/book-flip.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
